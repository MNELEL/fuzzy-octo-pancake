name: Build Frida Injector (Hebrew)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['FridaInjector/**', '.github/workflows/build-frida.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FridaInjector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11' }
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Align and sign
        env: { KS_PASS: fridam5s123 }
        run: |
          BT="$ANDROID_HOME/build-tools"; VER=$(ls "$BT" | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          "$BT/$VER/zipalign" -p 4 "$APK" app-aligned.apk
          "$BT/$VER/apksigner" sign --ks frida-m5s.jks --ks-pass pass:$KS_PASS --out FridaInjector-he.apk app-aligned.apk
          "$BT/$VER/apksigner" verify FridaInjector-he.apk
      - uses: actions/upload-artifact@v4
        with: { name: FridaInjector-he, path: FridaInjector/FridaInjector-he.apk }
