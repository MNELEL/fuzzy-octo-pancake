name: Build ApkSignatureKill (Hebrew)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['ApkSignatureKill/**', '.github/workflows/build-asignkill.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ApkSignatureKill
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: chmod +x gradlew
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Align and sign
        env: { KS_PASS: askm5s123 }
        run: |
          BT="$ANDROID_HOME/build-tools"; VER=$(ls "$BT" | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          "$BT/$VER/zipalign" -p 4 "$APK" app-aligned.apk
          "$BT/$VER/apksigner" sign --ks ask-m5s.jks --ks-pass pass:$KS_PASS --out ApkSignatureKill-he.apk app-aligned.apk
          "$BT/$VER/apksigner" verify ApkSignatureKill-he.apk
      - uses: actions/upload-artifact@v4
        with: { name: ApkSignatureKill-he, path: ApkSignatureKill/ApkSignatureKill-he.apk }
